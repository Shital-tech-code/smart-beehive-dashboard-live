<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Smart Beehive Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:"Segoe UI",sans-serif;
  background:#f4f6f9;
}

header{
  background:#f4b400;
  color:#fff;
  padding:15px;
  text-align:center;
  font-size:20px;
  font-weight:600;
}

main{
  padding:12px;
}

.hive{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 4px 10px rgba(0,0,0,.08);
  border-left:5px solid #f4b400;
}

.top{
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

.status{
  background:#e6f4ea;
  padding:3px 10px;
  border-radius:20px;
  font-size:12px;
}

.location{
  font-size:13px;
  color:#555;
  margin:5px 0;
}

.metrics{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin-bottom:6px;
}

.time{
  font-size:11px;
  color:#888;
  text-align:right;
}
</style>
</head>

<body>

<header>🐝 Smart Beehive</header>
<main id="hiveContainer"></main>

<script>

let charts = {};

// FAST LOCATION
function getLocationName(hive){
  if(hive.hive_id === "Hive_2"){
    return "📍 MGIRI, Wardha";
  }
  return "📍 Wardha";
}

// GRAPH
function createChart(id, hive){

  const ctx = document.getElementById(id);

  if(charts[id]){
    charts[id].destroy();
  }

  charts[id] = new Chart(ctx, {
    type: 'line',
    data: {
      labels: ["Temp", "Humidity", "Weight"],
      datasets: [{
        data: [
          hive.temperature,
          hive.humidity,
          hive.total_weight
        ],
        borderWidth: 2,
        tension: 0.4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { display: false } },
      scales: { y: { beginAtZero: true } }
    }
  });
}

// LOAD DATA
async function loadData(){

  const container = document.getElementById("hiveContainer");

  try{
    const res = await fetch("/data?nocache=" + Date.now());
    const json = await res.json();

    container.innerHTML = "";

    for(const hive of json.hives){

      if(!hive.hive_id) continue;

      let locationName = getLocationName(hive);

      container.innerHTML += `
        <div class="hive">
          
          <div class="top">
            <span>🐝 ${hive.hive_id}</span>
            <span class="status">🟢 ${hive.status}</span>
          </div>

          <div class="location">${locationName}</div>

          <div class="metrics">
            <span>🌡 ${hive.temperature}°C</span>
            <span>💧 ${hive.humidity}%</span>
            <span>⚖ ${hive.total_weight} kg</span>
          </div>

          <canvas id="chart_${hive.hive_id}" height="100"></canvas>

          <div class="time">⏱ ${hive.timestamp}</div>

        </div>
      `;

      setTimeout(()=>{
        createChart(`chart_${hive.hive_id}`, hive);
      },50);
    }

  }catch(err){
    container.innerHTML = "⚠️ Error loading data";
    console.error(err);
  }
}

// AUTO REFRESH
loadData();
setInterval(loadData,15000);

</script>

</body>
</html>
