<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Smart Beehive</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:'Segoe UI',sans-serif;
  background:linear-gradient(135deg,#eef1f5,#e3e8ee);
}

/* HEADER */
header{
  background:linear-gradient(90deg,#f4b400,#ffcc00);
  padding:16px;
  text-align:center;
  font-size:22px;
  font-weight:bold;
  color:#fff;
  letter-spacing:1px;
  box-shadow:0 3px 10px rgba(0,0,0,.2);
}

/* CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:12px;
}

/* CARD */
.card{
  background:rgba(255,255,255,0.9);
  backdrop-filter:blur(10px);
  border-radius:16px;
  padding:14px;
  margin-bottom:16px;
  box-shadow:0 6px 18px rgba(0,0,0,.1);
  transition:all 0.3s ease;
  border:1px solid rgba(255,255,255,0.4);
}

.card:hover{
  transform:translateY(-5px);
  box-shadow:0 12px 25px rgba(0,0,0,.15);
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
  font-size:16px;
}

/* STATUS */
.status{
  background:#28a745;
  color:#fff;
  padding:4px 12px;
  border-radius:20px;
  font-size:12px;
  box-shadow:0 0 10px rgba(40,167,69,0.6);
}

/* INFO */
.info{
  font-size:13px;
  margin:6px 0;
  color:#444;
}

/* GRAPH GRID */
.chartGrid{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:10px;
}

/* GRAPH BOX */
.chartBox{
  height:110px;
  width:30%;
  background:#f9fafc;
  border-radius:10px;
  padding:6px;
  box-shadow:inset 0 1px 4px rgba(0,0,0,.05);
  transition:0.2s;
}

.chartBox:hover{
  transform:scale(1.05);
}

/* TIME */
.time{
  font-size:11px;
  color:#888;
  text-align:right;
  margin-top:6px;
}
</style>

</head>

<body>

<header>🐝 Smart Beehive Dashboard</header>

<div class="container" id="app"></div>

<script>

// 📊 COMPACT VERTICAL BAR
function createChart(id, value, label, color){

  const ctx = document.getElementById(id).getContext("2d");

  new Chart(ctx,{
    type:"bar",
    data:{
      labels:[label],
      datasets:[{
        data:[value],
        backgroundColor:color,
        barThickness:6,
        borderRadius:6
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{
          display:true,
          ticks:{font:{size:10}}
        },
        y:{
          beginAtZero:true,
          ticks:{font:{size:9}}
        }
      },
      responsive:true,
      maintainAspectRatio:false
    }
  });
}

// 📍 LOCATION
async function getLocation(hive){
  if(hive.hive_id === "Hive_2"){
    return "📍 MGIRI, Wardha";
  }
  return "📍 GPS Location";
}

// 🔄 LOAD DATA
async function load(){

  const res = await fetch("/data");
  const data = await res.json();

  const app = document.getElementById("app");
  app.innerHTML = "";

  for(const hive of data.hives){

    const loc = await getLocation(hive);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="top">
        <div>🐝 ${hive.hive_id}</div>
        <div class="status">${hive.status || "Active"}</div>
      </div>

      <div class="info">🌡 Temperature: ${hive.temperature} °C</div>
      <div class="info">💧 Humidity: ${hive.humidity} %</div>
      <div class="info">⚖ Total Weight: ${hive.total_weight} kg</div>
      <div class="info">${loc}</div>

      <div class="time">⏱ ${hive.timestamp}</div>

      <div class="chartGrid">
        <div class="chartBox"><canvas id="t_${hive.hive_id}"></canvas></div>
        <div class="chartBox"><canvas id="h_${hive.hive_id}"></canvas></div>
        <div class="chartBox"><canvas id="w_${hive.hive_id}"></canvas></div>
      </div>
    `;

    app.appendChild(card);

    // 📊 Charts
    createChart(`t_${hive.hive_id}`, hive.temperature, "Temp", "#ff9800");
    createChart(`h_${hive.hive_id}`, hive.humidity, "Hum", "#2196f3");
    createChart(`w_${hive.hive_id}`, hive.total_weight, "Weight", "#4caf50");
  }
}

// AUTO REFRESH
load();
setInterval(load,15000);

</script>

</body>
</html>
