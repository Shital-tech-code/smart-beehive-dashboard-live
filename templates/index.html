<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Smart Beehive Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#f3f3f3;
}

/* HEADER */
header{
  background:#f4b400;
  color:#fff;
  text-align:center;
  padding:15px;
  font-size:22px;
  font-weight:bold;
}

/* ROW */
.row{
  display:flex;
  gap:10px;
  padding:10px;
  flex-wrap:wrap;
}

/* CARD */
.card{
  flex:1;
  min-width:280px;
  background:#fff;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
  padding:12px;
}

/* STATUS */
.status{
  background:#28a745;
  color:#fff;
  padding:6px;
  border-radius:5px;
  margin:8px 0;
}

/* ITEM */
.item{
  margin:6px 0;
  font-size:14px;
}

/* GRAPH SECTION */
.graph{
  margin:10px;
  background:#fff;
  padding:10px;
  border-radius:10px;
  box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.chartBox{
  height:120px;
}
</style>

</head>

<body>

<header>🐝 SMART BEEHIVE DASHBOARD</header>

<!-- 🐝 HIVE CARDS -->

<div class="row" id="cards"></div>

<!-- 📊 GRAPHS -->

<div class="graph">
  <h3>🌡 Temperature</h3>
  <div class="chartBox"><canvas id="tempChart"></canvas></div>
</div>

<div class="graph">
  <h3>💧 Humidity</h3>
  <div class="chartBox"><canvas id="humChart"></canvas></div>
</div>

<div class="graph">
  <h3>⚖ Weight</h3>
  <div class="chartBox"><canvas id="weightChart"></canvas></div>
</div>

<script>

// 📊 BAR CHART FUNCTION
function createBarChart(id, labels, data, color){

  const ctx = document.getElementById(id).getContext("2d");

   new Chart(ctx,{
    type:"bar",
    data:{
      labels:labels,
      datasets:[{
        data:data,
        backgroundColor:color,
        barThickness:20,          // ✅ thinner bars
        maxBarThickness:25        // ✅ control max size
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        y:{
          beginAtZero:true,
          ticks:{
            font:{size:10}        // ✅ small text
          }
        },
        x:{
          ticks:{
            font:{size:11}
          }
        }
      }
    }
  });
}

// 📍 LOCATION
async function getLocation(hive){
  if(hive.hive_id === "Hive_2"){
    return "MGIRI, Wardha";
  }
  return "GPS Location";
}

// 🔄 LOAD DATA
async function load(){

  const res = await fetch("/data");
  const data = await res.json();

  const h1 = data.hives.find(h=>h.hive_id==="Hive_1");
  const h2 = data.hives.find(h=>h.hive_id==="Hive_2");

  // 🐝 CARDS
  const cards = document.getElementById("cards");
  cards.innerHTML = "";

  for(const hive of [h1,h2]){

    const loc = await getLocation(hive);

    cards.innerHTML += `
      <div class="card">
        <b>Hive ID: ${hive.hive_id}</b>
        <div class="status">🟢 Status: ${hive.status}</div>

        <div class="item">🌡 Temperature: ${hive.temperature} °C</div>
        <div class="item">💧 Humidity: ${hive.humidity} %</div>
        <div class="item">⚖ Weight 1: ${hive.weight1 || 0} kg</div>
        <div class="item">⚖ Weight 2: ${hive.weight2 || 0} kg</div>
        <div class="item">📦 Total Weight: ${hive.total_weight} kg</div>
        <div class="item">📍 Location: ${loc}</div>
        <div class="item">⏱ Last update: ${hive.timestamp}</div>
      </div>
    `;
  }

  // 📊 BAR GRAPHS (ONLY 3 PARAMETERS)
  createBarChart(
    "tempChart",
    ["Hive_1","Hive_2"],
    [h1.temperature, h2.temperature],
    ["orange","red"]
  );

  createBarChart(
    "humChart",
    ["Hive_1","Hive_2"],
    [h1.humidity, h2.humidity],
    ["blue","cyan"]
  );

  createBarChart(
    "weightChart",
    ["Hive_1","Hive_2"],
    [h1.total_weight, h2.total_weight],
    ["green","darkgreen"]
  );
}

// AUTO REFRESH
load();
setInterval(load,15000);

</script>

</body>
</html>
