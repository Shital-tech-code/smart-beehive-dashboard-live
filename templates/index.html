<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Beehive</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#eef1f5;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#f4b400,#ffcc00);
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#fff;
}

/* CENTER CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:10px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
}

/* STATUS */
.status{
  background:#28a745;
  color:#fff;
  padding:4px 12px;
  border-radius:20px;
  font-size:12px;
}

/* LOCATION */
.location{
  font-size:13px;
  color:#666;
  margin:6px 0;
}

/* METRICS */
.metrics{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin:8px 0;
  border-bottom:1px solid #eee;
  padding-bottom:6px;
}

/* GRAPH FIX */
.chartBox{
  height:120px;
}

/* TIME */
.time{
  font-size:11px;
  color:#999;
  text-align:right;
  margin-top:6px;
}
</style>
</head>

<body>

<header>🐝 Smart Beehive</header>
<div class="container" id="app"></div>

<script>

let charts = {};

function getLocation(hive){
  if(hive.hive_id === "Hive_2"){
    return "📍 MGIRI, Wardha";
  }
  return "📍 Yavatmal";
}

function createChart(id, hive){

  if(charts[id]) charts[id].destroy();

  const ctx = document.getElementById(id).getContext("2d");

  // gradient (like your image)
  const gradient = ctx.createLinearGradient(0,0,0,120);
  gradient.addColorStop(0,"rgba(54,162,235,0.4)");
  gradient.addColorStop(1,"rgba(54,162,235,0)");

  charts[id] = new Chart(ctx, {
    type: "line",
    data: {
      labels: ["Temp","Humidity","Weight"],
      datasets: [{
        data: [
          hive.temperature,
          hive.humidity,
          hive.total_weight
        ],
        borderWidth:2,
        tension:0.4,
        fill:true,
        backgroundColor:gradient,
        pointRadius:4
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{grid:{display:false}},
        y:{beginAtZero:true}
      }
    }
  });
}

async function load(){

  const res = await fetch("/data?x="+Date.now());
  const data = await res.json();

  const app = document.getElementById("app");
  app.innerHTML = "";

  data.hives.forEach(hive=>{

    app.innerHTML += `
    <div class="card">

      <div class="top">
        <div>🐝 ${hive.hive_id}</div>
        <div class="status">${hive.status}</div>
      </div>

      <div class="location">${getLocation(hive)}</div>

      <div class="metrics">
        <div>🌡 ${hive.temperature}°C</div>
        <div>💧 ${hive.humidity}%</div>
        <div>⚖ ${hive.total_weight}kg</div>
      </div>

      <div class="chartBox">
        <canvas id="c_${hive.hive_id}"></canvas>
      </div>

      <div class="time">⏱ ${hive.timestamp}</div>

    </div>
    `;

    setTimeout(()=>{
      createChart(`c_${hive.hive_id}`, hive);
    },50);

  });
}

load();
setInterval(load,15000);

</script>

</body>
</html>
