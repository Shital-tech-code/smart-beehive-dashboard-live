<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Smart Beehive</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#eef1f5;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#f4b400,#ffcc00);
  padding:14px;
  text-align:center;
  font-size:20px;
  font-weight:bold;
  color:#fff;
}

/* CONTAINER */
.container{
  max-width:420px;
  margin:auto;
  padding:10px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:14px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 4px 12px rgba(0,0,0,.1);
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  font-weight:600;
}

/* STATUS */
.status{
  background:#28a745;
  color:#fff;
  padding:4px 12px;
  border-radius:20px;
  font-size:12px;
}

/* LOCATION */
.location{
  font-size:13px;
  color:#666;
  margin:6px 0;
}

/* METRICS */
.metrics{
  display:flex;
  justify-content:space-between;
  font-size:14px;
  margin:8px 0;
  border-bottom:1px solid #eee;
  padding-bottom:6px;
}

/* GRAPH */
.chartBox{
  height:80px;
  margin-top:6px;
}

/* TIME */
.time{
  font-size:11px;
  color:#999;
  text-align:right;
  margin-top:6px;
}
</style>

</head>

<body>

<header>🐝 Smart Beehive Dashboard</header>
<div class="container" id="app"></div>

<script>

let charts = {};

// 📍 LOCATION FUNCTION
async function getLocation(hive){

  if(hive.hive_id === "Hive_2"){
    return "📍 MGIRI, Wardha";
  }

  try{
    const res = await fetch(
      `https://nominatim.openstreetmap.org/reverse?format=json&lat=${hive.latitude}&lon=${hive.longitude}`
    );
    const data = await res.json();

    return "📍 " + (data.display_name || "Unknown location");

  }catch{
    return "📍 Unknown location";
  }
}

// 📊 CREATE SINGLE GRAPH
function createChart(id, label, value){

  const ctx = document.getElementById(id).getContext("2d");

  const gradient = ctx.createLinearGradient(0,0,0,80);
  gradient.addColorStop(0,"rgba(54,162,235,0.4)");
  gradient.addColorStop(1,"rgba(54,162,235,0)");

  return new Chart(ctx,{
    type:"line",
    data:{
      labels:["Now"],
      datasets:[{
        label:label,
        data:[value],
        borderWidth:2,
        tension:0.4,
        fill:true,
        backgroundColor:gradient,
        pointRadius:3
      }]
    },
    options:{
      responsive:true,
      maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{display:false},
        y:{beginAtZero:true}
      }
    }
  });
}

// 🔄 LOAD DATA
async function load(){

  const res = await fetch("/data?x="+Date.now());
  const data = await res.json();

  const app = document.getElementById("app");
  app.innerHTML = "";

  for(const hive of data.hives){

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="top">
        <div>🐝 ${hive.hive_id}</div>
        <div class="status">${hive.status || "Active"}</div>
      </div>

      <div class="location">Loading...</div>

      <div class="metrics">
        <div>🌡 ${hive.temperature}°C</div>
        <div>💧 ${hive.humidity}%</div>
        <div>⚖ ${hive.total_weight}kg</div>
      </div>

      <div class="chartBox"><canvas id="t_${hive.hive_id}"></canvas></div>
      <div class="chartBox"><canvas id="h_${hive.hive_id}"></canvas></div>
      <div class="chartBox"><canvas id="w_${hive.hive_id}"></canvas></div>

      <div class="time">⏱ ${hive.timestamp}</div>
    `;

    app.appendChild(card);

    // 📍 Load location
    const locationName = await getLocation(hive);
    card.querySelector(".location").textContent = locationName;

    // 📊 Create graphs
    createChart(`t_${hive.hive_id}`, "Temp", hive.temperature);
    createChart(`h_${hive.hive_id}`, "Humidity", hive.humidity);
    createChart(`w_${hive.hive_id}`, "Weight", hive.total_weight);
  }
}

// AUTO REFRESH
load();
setInterval(load,15000);

</script>

</body>
</html>
