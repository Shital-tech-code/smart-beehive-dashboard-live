<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Smart Beehive</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
  margin:0;
  font-family:Segoe UI;
  background:#eef1f5;
}

/* HEADER */
header{
  background:linear-gradient(90deg,#f4b400,#ffcc00);
  padding:14px;
  text-align:center;
  font-size:20px;
  color:#fff;
}

/* MAIN CONTAINER */
.container{
  max-width:900px;
  margin:auto;
  padding:10px;
}

/* CARD */
.card{
  background:#fff;
  border-radius:12px;
  padding:12px;
  margin-bottom:14px;
  box-shadow:0 2px 8px rgba(0,0,0,.1);
  transition:0.3s;
}

.card:hover{
  transform:scale(1.01);
}

/* TOP */
.top{
  display:flex;
  justify-content:space-between;
  font-weight:600;
}

/* STATUS */
.status{
  background:#28a745;
  color:#fff;
  padding:3px 10px;
  border-radius:20px;
  font-size:11px;
}

/* INFO */
.info{
  font-size:13px;
  margin:4px 0;
}

/* GRAPH GRID */
.chartGrid{
  display:flex;
  justify-content:space-between;
  gap:10px;
  margin-top:8px;
}

/* SMALL GRAPH */
.chartBox{
  height:110px;
  width:30%;
}
</style>

</head>

<body>

<header>🐝 Smart Beehive Dashboard</header>

<div class="container" id="app"></div>

<script>

// 📊 COMPACT VERTICAL BAR
function createChart(id, value, label, color){

  const ctx = document.getElementById(id).getContext("2d");

  new Chart(ctx,{
    type:"bar",
    data:{
      labels:[label],   // important for vertical bar
      datasets:[{
        data:[value],
        backgroundColor:color,
        barThickness:6,   // thin bar
        borderRadius:6
      }]
    },
    options:{
      plugins:{legend:{display:false}},
      scales:{
        x:{
          display:true,
          ticks:{font:{size:10}}
        },
        y:{
          beginAtZero:true,
          ticks:{font:{size:9}}
        }
      },
      responsive:true,
      maintainAspectRatio:false
    }
  });
}

// 📍 LOCATION
async function getLocation(hive){
  if(hive.hive_id === "Hive_2"){
    return "📍 MGIRI, Wardha";
  }
  return "📍 GPS Location";
}

// 🔄 LOAD DATA
async function load(){

  const res = await fetch("/data");
  const data = await res.json();

  const app = document.getElementById("app");
  app.innerHTML = "";

  for(const hive of data.hives){

    const loc = await getLocation(hive);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="top">
        <div>🐝 ${hive.hive_id}</div>
        <div class="status">${hive.status || "Active"}</div>
      </div>

      <div class="info">🌡 Temp: ${hive.temperature} °C</div>
      <div class="info">💧 Humidity: ${hive.humidity} %</div>
      <div class="info">⚖ Weight: ${hive.total_weight} kg</div>
      <div class="info">${loc}</div>
      <div class="info">⏱ ${hive.timestamp}</div>

      <div class="chartGrid">
        <div class="chartBox"><canvas id="t_${hive.hive_id}"></canvas></div>
        <div class="chartBox"><canvas id="h_${hive.hive_id}"></canvas></div>
        <div class="chartBox"><canvas id="w_${hive.hive_id}"></canvas></div>
      </div>
    `;

    app.appendChild(card);

    // 📊 Create compact graphs
    createChart(`t_${hive.hive_id}`, hive.temperature, "Temp", "#ff9800");
    createChart(`h_${hive.hive_id}`, hive.humidity, "Hum", "#2196f3");
    createChart(`w_${hive.hive_id}`, hive.total_weight, "Weight", "#4caf50");
  }
}

// AUTO REFRESH
load();
setInterval(load,15000);

</script>

</body>
</html>
