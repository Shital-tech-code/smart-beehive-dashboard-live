<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🐝 Smart Beehive Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* BODY */
body {
  margin: 0;
  font-family: 'Segoe UI', sans-serif;
  background: linear-gradient(135deg, #eef1f5, #dce3ec);
}

/* HEADER */
header {
  background: linear-gradient(90deg, #f4b400, #ffcc00);
  padding: 20px;
  text-align: center;
  font-size: 28px;
  font-weight: bold;
  color: #fff;
  letter-spacing: 1px;
  box-shadow: 0 5px 20px rgba(0,0,0,0.2);
  position: sticky;
  top: 0;
  z-index: 100;
  transition: all 0.3s ease;
}

/* CONTAINER */
.container {
  max-width: 1000px;
  margin: auto;
  padding: 16px;
  display: flex;
  flex-wrap: wrap;
  gap: 20px;
  justify-content: center;
}

/* CARD */
.card {
  background: linear-gradient(145deg, #ffffff, #f0f4f9);
  border-radius: 20px;
  padding: 20px;
  flex: 1 1 300px;
  max-width: 320px;
  box-shadow: 0 8px 25px rgba(0,0,0,0.1);
  transition: transform 0.3s, box-shadow 0.3s;
}

.card:hover {
  transform: translateY(-8px);
  box-shadow: 0 15px 35px rgba(0,0,0,0.2);
}

/* TOP */
.top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-weight: 600;
  font-size: 18px;
}

/* STATUS */
.status {
  padding: 6px 16px;
  border-radius: 25px;
  font-size: 13px;
  font-weight: bold;
  color: #fff;
  background: linear-gradient(90deg, #28a745, #5cd65c);
  box-shadow: 0 0 12px rgba(40,167,69,0.5);
  text-align: center;
}

/* INFO */
.info {
  font-size: 14px;
  margin: 8px 0;
  color: #333;
  display: flex;
  align-items: center;
  gap: 6px;
}

.info span {
  font-weight: bold;
}

/* CHART GRID */
.chartGrid {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  margin-top: 12px;
}

/* CHART BOX */
.chartBox {
  flex: 1;
  height: 120px;
  background: #f9fafc;
  border-radius: 12px;
  padding: 8px;
  box-shadow: inset 0 1px 5px rgba(0,0,0,0.05);
  transition: transform 0.2s;
}

.chartBox:hover {
  transform: scale(1.05);
}

/* TIME */
.time {
  font-size: 12px;
  color: #666;
  text-align: right;
  margin-top: 6px;
}

/* RESPONSIVE */
@media(max-width: 768px) {
  .card {
    max-width: 100%;
  }
  .chartGrid {
    flex-direction: column;
  }
}
</style>
</head>

<body>

<header>🐝 Smart Beehive Dashboard</header>

<div class="container" id="app"></div>

<script>
// Gradient Bar Helper
function gradientBar(ctx, colorStart, colorEnd) {
  const gradient = ctx.createLinearGradient(0, 0, 0, 150);
  gradient.addColorStop(0, colorStart);
  gradient.addColorStop(1, colorEnd);
  return gradient;
}

// Create Chart with Gradient and Smooth Animation
function createChart(id, value, label, colorStart, colorEnd){
  const ctx = document.getElementById(id).getContext("2d");
  new Chart(ctx,{
    type: "bar",
    data: {
      labels: [label],
      datasets: [{
        data: [value],
        backgroundColor: gradientBar(ctx, colorStart, colorEnd),
        borderRadius: 8,
        barThickness: 12
      }]
    },
    options: {
      plugins: { legend: { display: false } },
      animation: { duration: 1000 },
      scales: {
        x: { ticks: { font: { size: 11 } } },
        y: { beginAtZero: true, ticks: { font: { size: 10 } } }
      },
      responsive: true,
      maintainAspectRatio: false
    }
  });
}

// Hive Location
async function getLocation(hive){
  if(hive.hive_id === "Hive_2") return "📍 MGIRI, Wardha";
  return "📍 GPS Location";
}

// Load Data & Render
async function load(){
  const res = await fetch("/data");
  const data = await res.json();
  const app = document.getElementById("app");
  app.innerHTML = "";

  for(const hive of data.hives){
    const loc = await getLocation(hive);

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="top">
        <div>🐝 ${hive.hive_id}</div>
        <div class="status">${hive.status || "Active"}</div>
      </div>
      <div class="info">🌡 <span>Temperature:</span> ${hive.temperature} °C</div>
      <div class="info">💧 <span>Humidity:</span> ${hive.humidity} %</div>
      <div class="info">⚖ <span>Total Weight:</span> ${hive.total_weight} kg</div>
      <div class="info">📍 ${loc}</div>
      <div class="time">⏱ ${hive.timestamp}</div>
      <div class="chartGrid">
        <div class="chartBox"><canvas id="t_${hive.hive_id}"></canvas></div>
        <div class="chartBox"><canvas id="h_${hive.hive_id}"></canvas></div>
        <div class="chartBox"><canvas id="w_${hive.hive_id}"></canvas></div>
      </div>
    `;

    app.appendChild(card);

    // Charts with gradients
    createChart(`t_${hive.hive_id}`, hive.temperature, "Temp", "#ffb74d", "#ff9800");
    createChart(`h_${hive.hive_id}`, hive.humidity, "Hum", "#64b5f6", "#2196f3");
    createChart(`w_${hive.hive_id}`, hive.total_weight, "Weight", "#81c784", "#4caf50");
  }
}

// Auto Refresh
load();
setInterval(load, 15000);

</script>
</body>
</html>
